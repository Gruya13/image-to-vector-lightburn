[project]
name = "img2vec-lightburn"
version = "2.0.0"
description = "Image-to-Vector sistem za Laser / LightBurn (SVG/DXF u mm)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "shapely>=2.0",
    "svgwrite>=1.4",
    "vpype>=1.13",
    "skan>=0.11",
    "rembg>=2.0.50",
    "onnxruntime>=1.17",
    "ezdxf>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
img2vec = "img2vec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/img2vec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "slow: spore end-to-end provere (dataset, ONNX modeli)",
]